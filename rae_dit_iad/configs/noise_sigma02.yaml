# Noise ablation (on B): larger SimpleNet-style noise, sigma = 0.2 (default 0.1).
experiment:
  id: ab_noise_sigma02
  loss: image_l1
  lambda_fm: 0.0
  decoder_finetune: false  # frozen decoder: gradients flow through it into the DiT
  corruption: simplenet  # the default; A is the only flow-path arm
  clamp_recon: false
  best_metric: img  # selects val_img (image L1 on val; lower = better)

discriminator:   # DRAEM's discriminative sub-network on the token grid (iad/disc.py)
  enabled: true
  d: 256          # hidden channels
  blocks: 4       # residual conv blocks
  w_seg: 1.0      # weight of the focal segmentation loss
  gamma: 2.0      # focal-loss focusing (DRAEM)
  detach: true    # true: the head never changes the DiT's training (clean comparisons)

rae_config: configs/stage2/training/ImageNet256/DiTDH-XL_DINOv2-B.yaml
rae_config_overrides:
  stage_2:
    ckpt: "models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt"

noise:
  # Default corruption (SimpleNet-style, iad.core.SIMPLENET_DEFAULTS):
  #   z_in = z0 + m * sigma * eps on a Perlin token mask m; no noise at test time.
  sigma: 0.2      # normalized-latent units; sweep with SIGMA or the noise_* ablations
  mask: perlin    # perlin | all  (all = SimpleNet exactly: every token noised)
  p_clean: 0.2    # fraction of samples left clean
  w_anom: 5.0     # latent-loss up-weight on corrupted tokens (when a latent term is used)
  mask_thr: 0.5

size: 256
seed: 42
scope: joint

training:
  steps: 4000
  batch_size: 2        # micro-batch (DiT-XL + decoder must fit in GPU memory)
  grad_accum_steps: 4  # effective batch = 2 x 4 = 8
  precision: fp32
  sdpa: math     # fused attention backward gave NaN gradients through the
                 # RAE decoder (jobs 152307/152338); math kernels: none (152339)
  clip_grad: 1.0
  log_every: 50
  val_every: 250
  save_every: 500
  n_val: 20
  use_ema: true
  ema_decay: 0.9995
  # --- memory/speed knobs: defaults are the fastest (full-speed) settings ---
  grad_checkpoint: false  # true = recompute activations in backward (slower step, much less VRAM)
  ema_device: cuda        # cuda = fastest; cpu = keeps EMA off the GPU (frees ~4 bytes/param)
  cache_latents: true
  decoder_lr_ratio: 0.1  # unused while decoder_finetune=false
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1.0e-8
  scheduler:
    type: linear
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_steps: 400
    decay_end_steps: 4000
    warmup_from_zero: false

inference:
  mode: single
  t: 0.2         # = noise.sigma (conditioning only)
  reps: 1
  ode_steps: 50
  blur_sigma: 4.0
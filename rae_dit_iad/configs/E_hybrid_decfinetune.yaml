# Experiment E: hybrid loss (image L1 + lambda_fm * flow matching), decoder FINETUNED
# decoder lr = 0.1 * DiT lr; encoder stays frozen.
experiment:
  id: E_hybrid_decfinetune
  loss: hybrid
  lambda_fm: 0.1  # override: --lambda-fm
  decoder_finetune: true
  corruption: flow
  clamp_recon: false
  best_metric: img

rae_config: configs/stage2/training/ImageNet256/DiTDH-XL_DINOv2-B.yaml
rae_config_overrides:
  stage_2:
    ckpt: "models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt"

noise:
  time_dist: logit-normal_0_1
  warp: false

size: 256
seed: 42
scope: joint

training:
  steps: 4000
  batch_size: 2        # micro-batch (DiT-XL + decoder must fit in GPU memory)
  grad_accum_steps: 4  # effective batch = 2 x 4 = 8
  precision: fp32
  clip_grad: 1.0
  log_every: 50
  val_every: 250
  save_every: 500
  n_val: 20
  use_ema: true
  ema_decay: 0.9995
  # --- memory/speed knobs: defaults are the fastest (full-speed) settings ---
  grad_checkpoint: false  # true = recompute activations in backward (slower step, much less VRAM)
  ema_device: cuda        # cuda = fastest; cpu = keeps EMA off the GPU (frees ~4 bytes/param)
  cache_latents: true
  decoder_lr_ratio: 0.1
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1.0e-8
  scheduler:
    type: linear
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_steps: 400
    decay_end_steps: 4000
    warmup_from_zero: false

inference:
  mode: single
  t: 0.5
  reps: 1
  ode_steps: 50
  blur_sigma: 4.0
# Experiment F: image-space L1 + SimpleNet-style feature adaptor after the encoder
# (decoder FROZEN) — direct single-variable comparison against B.
#
# The adaptor A sits between the frozen encoder and the DiT/decoder and defines
# the latent space both operate on:
#     x --encoder--> z0 --A--> z~0 --corruption--> z_t --DiT--> z^~ --decoder--> x^
# A is a residual bottleneck (z + h(z)) with a zero-initialized head, so step 0
# is *exactly* experiment B (h == 0 => A == identity) and the frozen decoder
# stays in-distribution while A learns the ImageNet -> MVTec feature correction.
experiment:
  id: F_image_l1_adaptor
  loss: image_l1
  lambda_fm: 0.0
  decoder_finetune: false
  corruption: flow
  clamp_recon: false
  best_metric: img  # selects val_img (image L1 on the val split)

rae_config: configs/stage2/training/ImageNet256/DiTDH-XL_DINOv2-B.yaml
rae_config_overrides:
  stage_2:
    ckpt: "models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt"

# --- the ablation under test ------------------------------------------------
# type:     simplenet | mlp | linear | conv1x1 | affine | none
#           simplenet = SimpleNet's Feature Adaptor (Linear-BN-LeakyReLU-Linear)
# rank:     bottleneck width = 768 // rank (rank 4 -> hidden 192)
# residual: A(z) = z + h(z); zero_init zeroes the head => A == identity at step 0
# init:     identity | train_stats   (train_stats = PatchCore/FeaNorm-style
#           per-channel standardization fitted on the MVTec *train split*; only
#           meaningful for `affine`, and it breaks the frozen-decoder pairing)
adaptor:
  type: simplenet
  rank: 4
  residual: true
  zero_init: true
  norm: batch        # batch (SimpleNet) | layer | none
  init: identity
  trainable: true

noise:
  # Consumed by image_l1/hybrid only; loss=flow_matching uses the official
  # transport's internal sampling (logit-normal_0_1 + official time warp).
  time_dist: logit-normal_0_1
  warp: false

size: 256
seed: 42
scope: joint

training:
  steps: 4000
  batch_size: 2        # micro-batch (DiT-XL + decoder must fit in GPU memory)
  grad_accum_steps: 4  # effective batch = 2 x 4 = 8
  precision: fp32
  clip_grad: 1.0
  log_every: 50
  val_every: 250
  save_every: 500
  n_val: 20
  use_ema: true
  ema_decay: 0.9995  # EMA covers the DiT and the adaptor; decoder saved raw
  # --- memory/speed knobs: defaults are the fastest (full-speed) settings ---
  grad_checkpoint: false  # true = recompute activations in backward (slower step, much less VRAM)
  ema_device: cuda        # cuda = fastest; cpu = keeps EMA off the GPU (frees ~4 bytes/param)
  cache_latents: true
  decoder_lr_ratio: 0.1  # unused when decoder_finetune=false
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1.0e-8
  scheduler:
    type: linear
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_steps: 400  # ~10% of steps, constant lr (official warmup_from_zero=false)
    decay_end_steps: 4000
    warmup_from_zero: false

inference:
  mode: single
  t: 0.5
  reps: 1
  ode_steps: 50
  blur_sigma: 4.0

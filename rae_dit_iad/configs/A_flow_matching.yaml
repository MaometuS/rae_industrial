# Experiment A: original flow matching (frozen decoder) — reproduces official RAE DiT objective
experiment:
  id: A_flow_matching
  loss: flow_matching  # calls official transport.training_losses internally
  lambda_fm: 0.0
  decoder_finetune: false
  corruption: flow
  clamp_recon: false
  best_metric: fm  # selects val_fm (official FM loss on val; lower = better)

rae_config: configs/stage2/training/ImageNet256/DiTDH-XL_DINOv2-B.yaml
rae_config_overrides:
  stage_2:
    ckpt: "models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt"

noise:
  # Consumed by image_l1/hybrid only; loss=flow_matching uses the official
  # transport's internal sampling (logit-normal_0_1 + official time warp).
  time_dist: logit-normal_0_1
  warp: false  # transport.sample applies the official warp itself

size: 256
seed: 42
scope: joint  # per spec: joint training baseline; per-category optional

training:
  steps: 4000
  batch_size: 8
  precision: fp32
  clip_grad: 1.0
  log_every: 50
  val_every: 250
  save_every: 500
  n_val: 20
  use_ema: true
  ema_decay: 0.9995
  cache_latents: true
  decoder_lr_ratio: 0.1  # unused when decoder_finetune=false
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1.0e-8
  scheduler:
    type: linear
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_steps: 400  # ~10% of steps, constant lr (official warmup_from_zero=false)
    decay_end_steps: 4000
    warmup_from_zero: false

inference:
  mode: single
  t: 0.5
  reps: 1
  ode_steps: 50
  blur_sigma: 4.0